# 앞단 WAF(ModSecurity 프록시)가 붙어도 실제 공격자 IP를 보도록 mod_remoteip 사용.
#   - WAF_PROXY_NET(.env) 에서 온 요청만 X-Forwarded-For 를 믿는다. 그 밖에서 온 XFF 는 무시(위조 방지).
#   - 이 값으로 REMOTE_ADDR(앱 로그 client_ip), Require ip(v1 접근 제한), %a(Apache 로그)가 모두 실제 IP가 된다.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy ${WAF_PROXY_NET}

# combined 와 같은 모양이지만
#   %h → %a          : 프록시 IP 대신 실제 클라이언트 IP
#   끝에 UNIQUE_ID    : app.log 의 request_id 와 같은 값 → Wazuh 에서 같은 요청끼리 묶는 키
# (끝에만 덧붙였으므로 Wazuh 기본 apache 디코더는 그대로 동작한다)
LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" %{UNIQUE_ID}e" shop_combined

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # v1(레거시 취약점)은 팀 네트워크에서만 접근 가능. 인터넷에는 노출하지 않는다.
    <Directory /var/www/html/public/api/v1>
        AllowOverride All
        # 허용 대역은 .env의 V1_ALLOWED_NET 값 (Apache가 시작할 때 환경변수에서 읽는다)
        Require ip ${V1_ALLOWED_NET}
        # 도커 내부망 대역 허용 (호스트에서 직접 curl 테스트용).
        # mod_remoteip 덕분에 WAF 경유 요청은 실제 IP로 판정되므로 이 줄로 우회되지 않는다.
        # 단, WAF가 X-Forwarded-For 를 안 붙이면 WAF IP로 판정돼 통과하니 WAF 설정에서 꼭 켤 것.
        Require ip 172.16.0.0/12
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/shop_error.log
    CustomLog ${APACHE_LOG_DIR}/shop_access.log shop_combined
</VirtualHost>
